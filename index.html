<section class="launch" id="launch">
  <h2>Official Launch</h2>
  <p>Join us as we begin a new digital journey.</p>
  <h3>14 February 2027</h3>

  <div id="countdown" style="font-size:25px;font-weight:bold;margin:25px 0;">
    Loading countdown...
  </div>

  <p>Innovating Today, Connecting Tomorrow.</p>
</section>

<script>
  const launchDate = new Date(2027, 1, 14, 0, 0, 0).getTime();

  function updateCountdown() {
    const now = new Date().getTime();
    const difference = launchDate - now;
    const display = document.getElementById("countdown");

    if (difference <= 0) {
      display.textContent = "We are officially launched!";
      return;
    }

    const days = Math.floor(difference / 86400000);
    const hours = Math.floor((difference % 86400000) / 3600000);
    const minutes = Math.floor((difference % 3600000) / 60000);
    const seconds = Math.floor((difference % 60000) / 1000);

    display.textContent =
      days + " Days | " + hours + " Hours | " +
      minutes + " Minutes | " + seconds + " Seconds";
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);
</script>
